name: release

# Build prebuilt artifacts and publish a GitHub Release whenever a version tag
# is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# A manual run (workflow_dispatch) is a dry run: it builds everything and
# uploads the files as a workflow artifact, but publishes no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    # Pinned to the oldest supported Ubuntu LTS, NOT ubuntu-latest: the binary
    # links against the build host's glibc, so a 24.04 build (glibc 2.39) refuses
    # to start on 22.04 ("GLIBC_2.39 not found") — which is exactly how the
    # AppImage catalog's test (run on 22.04) rejected v0.25.1.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The auto key doesn't include the runner image; never restore objects
          # built against another glibc.
          key: ubuntu-22.04

      - name: System build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libvulkan-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libfontconfig1-dev libgl1-mesa-dev \
            desktop-file-utils \
            libxkbcommon-x11-0 libxcursor1 libxi6

      # Never ship a tag whose tests fail.
      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        # Stamp the commit so `jetty --version` names it ("dev" is for local builds).
        run: JETTY_BUILD="${GITHUB_SHA::7}" cargo build --release --bin jetty

      - name: glibc floor check
        # Fail before anything ships if the binary needs a glibc newer than
        # 22.04's 2.35. Rust std weak-links newer symbols (pidfd_spawnp,
        # pidfd_getpid @ GLIBC_2.39) when the build host has them, and the
        # loader rejects the version tag even though the symbols are optional.
        run: |
          floor=GLIBC_2.35
          max=$(objdump -T target/release/jetty | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "highest glibc version required: $max (floor $floor)"
          if [ "$(printf '%s\n' "$max" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::jetty requires $max, newer than $floor"
            exit 1
          fi

      - name: Tarball
        run: |
          ver="${GITHUB_REF_NAME#v}"
          stage="jetty-${ver}-x86_64-linux"
          mkdir -p "dist/${stage}"
          cp target/release/jetty "dist/${stage}/"
          cp -r assets README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "${stage}.tar.gz" "${stage}"

      - name: Debian package (.deb)
        run: |
          cargo install cargo-deb --locked
          cargo deb -p jetty --no-build
          cp target/debian/*.deb "jetty_${GITHUB_REF_NAME#v}_amd64.deb" 2>/dev/null || cp target/debian/*.deb .

      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir
          # AppStream metadata (description, links, screenshots) — read by the
          # AppImage catalog for the app page. Validated with
          # `appstreamcli validate-tree AppDir`.
          install -Dm644 assets/io.github.bozdemir.jetty.metainfo.xml \
            AppDir/usr/share/metainfo/io.github.bozdemir.jetty.metainfo.xml
          # --icon-filename jetty: deploy the icon under the name the .desktop's
          # `Icon=jetty` entry expects (linuxdeploy otherwise names it after the
          # source file "jetty-256" → "Could not find suitable icon for Icon
          # entry: jetty" and the AppImage step fails).
          # The libraries JeTTY dlopen()s that a minimal system may lack —
          # xkbcommon-x11 missing made winit panic at startup in the AppImage
          # catalog's test VM. linuxdeploy bundles them (and their deps, minus
          # its excludelist: libX11, libxcb, EGL/GL stay the host's) next to
          # the binary, whose RUNPATH ($ORIGIN/../lib) dlopen() searches first.
          L=/usr/lib/x86_64-linux-gnu
          ./linuxdeploy --appdir AppDir \
            --executable target/release/jetty \
            --library "$L/libxkbcommon.so.0" \
            --library "$L/libxkbcommon-x11.so.0" \
            --library "$L/libXcursor.so.1" \
            --library "$L/libXi.so.6" \
            --desktop-file assets/jetty.desktop \
            --icon-file assets/icons/jetty-256.png \
            --icon-filename jetty \
            --output appimage
          mv ./*.AppImage "JeTTY-${GITHUB_REF_NAME#v}-x86_64.AppImage"

      - name: Checksums
        run: sha256sum *.tar.gz *.deb *.AppImage > SHA256SUMS.txt

      - name: Upload artifacts (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: jetty-dry-run
          path: |
            *.tar.gz
            *.deb
            *.AppImage
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          # Curated notes from docs/release-notes/<tag>.md when present.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            *.tar.gz
            *.deb
            *.AppImage
            SHA256SUMS.txt
