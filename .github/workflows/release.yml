name: release

# Build prebuilt artifacts and publish a GitHub Release whenever a version tag
# is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# A manual run (workflow_dispatch) is a dry run: it builds everything and
# uploads the files as a workflow artifact, but publishes no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Least privilege: `build` — every build script, test, cargo-deb and
# linuxdeploy — runs with a read-only token that isn't even left in
# .git/config; only `publish`, which builds nothing, can write the release.
permissions:
  contents: read

# Third-party actions are pinned to a commit (the tag it was taken from in the
# comment beside it), and so are the tools the job downloads: a moved tag or a
# replaced download can't change what builds a release.

jobs:
  build:
    # Pinned to the oldest supported Ubuntu LTS, NOT ubuntu-latest: the binary
    # links against the build host's glibc, so a 24.04 build (glibc 2.39) refuses
    # to start on 22.04 ("GLIBC_2.39 not found") — which is exactly how the
    # AppImage catalog's test (run on 22.04) rejected v0.25.1.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # A tag publishes what the tree calls that version — or nothing.
      - name: Version check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          app=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/jetty-app/Cargo.toml | head -n1)
          meta=$(grep -o '<release version="[^"]*"' assets/io.github.bozdemir.jetty.metainfo.xml | head -n1 | cut -d'"' -f2)
          echo "tag $tag · Cargo.toml $root · crates/jetty-app $app · metainfo $meta"
          if [ "$root" != "$tag" ] || [ "$app" != "$tag" ] || [ "$meta" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml ($root), crates/jetty-app ($app) and the metainfo's newest <release> ($meta) must agree"
            exit 1
          fi
          if [ ! -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "::warning::no docs/release-notes/$GITHUB_REF_NAME.md — the release gets no notes"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The auto key doesn't include the runner image; never restore objects
          # built against another glibc.
          key: ubuntu-22.04

      - name: System build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libvulkan-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libfontconfig1-dev libgl1-mesa-dev \
            desktop-file-utils zsync \
            libxkbcommon-x11-0 libxcursor1 libxi6

      # Never ship a tag whose tests fail.
      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        # Stamp the commit so `jetty --version` names it ("dev" is for local builds).
        run: JETTY_BUILD="${GITHUB_SHA::7}" cargo build --release --bin jetty

      - name: glibc floor check
        # Fail before anything ships if the binary needs a glibc newer than
        # 22.04's 2.35. Rust std weak-links newer symbols (pidfd_spawnp,
        # pidfd_getpid @ GLIBC_2.39) when the build host has them, and the
        # loader rejects the version tag even though the symbols are optional.
        run: |
          floor=GLIBC_2.35
          max=$(objdump -T target/release/jetty | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "highest glibc version required: $max (floor $floor)"
          if [ "$(printf '%s\n' "$max" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::jetty requires $max, newer than $floor"
            exit 1
          fi

      - name: Tarball
        # What install.sh installs — the binary, the icons, the launcher entry
        # (plus the AppStream metadata) — not the README's screenshots.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          stage="jetty-${ver}-x86_64-linux"
          mkdir -p "dist/${stage}/assets"
          cp target/release/jetty README.md LICENSE "dist/${stage}/"
          cp -r assets/icons assets/jetty.desktop assets/io.github.bozdemir.jetty.metainfo.xml \
            "dist/${stage}/assets/"
          tar -C dist -czf "${stage}.tar.gz" "${stage}"

      - name: Debian package (.deb)
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb -p jetty --no-build
          cp target/debian/*.deb "jetty_${GITHUB_REF_NAME#v}_amd64.deb" 2>/dev/null || cp target/debian/*.deb .

      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Update information embedded in the AppImage: AppImageUpdate (and
          # tools built on it) asks the GitHub API for the latest release, takes
          # its .zsync and downloads only the blocks that changed.
          LDAI_UPDATE_INFORMATION: "gh-releases-zsync|bozdemir|JeTTY|latest|JeTTY-*x86_64.AppImage.zsync"
        run: |
          # A dated linuxdeploy build, checked against its sha256 before it runs
          # (`continuous` is replaced in place every few weeks). To move to a
          # newer one: its release lists the asset's digest — then make a dry
          # run and check the AppImage as for v0.28.1 (LD_DEBUG=libs, .upd_info).
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
          mkdir -p AppDir
          # AppStream metadata (description, links, screenshots) — read by the
          # AppImage catalog for the app page. Validated with
          # `appstreamcli validate-tree AppDir`.
          install -Dm644 assets/io.github.bozdemir.jetty.metainfo.xml \
            AppDir/usr/share/metainfo/io.github.bozdemir.jetty.metainfo.xml
          # --icon-filename jetty: deploy the icon under the name the .desktop's
          # `Icon=jetty` entry expects (linuxdeploy otherwise names it after the
          # source file "jetty-256" → "Could not find suitable icon for Icon
          # entry: jetty" and the AppImage step fails).
          # The libraries JeTTY dlopen()s that a minimal system may lack —
          # xkbcommon-x11 missing made winit panic at startup in the AppImage
          # catalog's test VM. linuxdeploy bundles them (and their deps, minus
          # its excludelist: libX11, libxcb, EGL/GL stay the host's) next to
          # the binary, whose RUNPATH ($ORIGIN/../lib) dlopen() searches first.
          L=/usr/lib/x86_64-linux-gnu
          ./linuxdeploy --appdir AppDir \
            --executable target/release/jetty \
            --library "$L/libxkbcommon.so.0" \
            --library "$L/libxkbcommon-x11.so.0" \
            --library "$L/libXcursor.so.1" \
            --library "$L/libXi.so.6" \
            --desktop-file assets/jetty.desktop \
            --icon-file assets/icons/jetty-256.png \
            --icon-filename jetty \
            --output appimage
          out="JeTTY-${GITHUB_REF_NAME#v}-x86_64.AppImage"
          mv ./*.AppImage "$out"
          # The .zsync is made here, after the rename, so the file name inside
          # it is the published one (one appimagetool may have written under
          # the old name is dropped).
          rm -f ./*.AppImage.zsync
          zsyncmake -o "$out.zsync" "$out"
          # Never publish an AppImage that can't find its updates.
          readelf --string-dump=.upd_info "$out" | grep -F 'gh-releases-zsync|bozdemir|JeTTY|'

      - name: Checksums
        run: sha256sum *.tar.gz *.deb *.AppImage *.zsync > SHA256SUMS.txt

      # A tag hands the files to `publish`; a dry run keeps them as the
      # `jetty-dry-run` artifact to inspect.
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && 'jetty-release' || 'jetty-dry-run' }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.deb
            *.AppImage
            *.zsync
            SHA256SUMS.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its files
      id-token: write      # sign the build-provenance attestation
      attestations: write  # store it
    steps:
      # Only for the curated notes (docs/release-notes/<tag>.md).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: jetty-release
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      # Signed provenance for every published file: which workflow, commit and
      # run built it (`gh attestation verify <file> --repo bozdemir/JeTTY`). A
      # sums file sitting next to the files proves integrity, not origin.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.zsync
            dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          # Curated notes from docs/release-notes/<tag>.md when present.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.zsync
            dist/SHA256SUMS.txt
