[package]
name = "jetty-app"
version = "0.26.1"
edition = "2021"

[dependencies]
jetty-core = { path = "../jetty-core" }
jetty-render = { path = "../jetty-render" }
jetty-platform = { path = "../jetty-platform" }
winit = "0.30"
pollster = "0.4"
wgpu = "29.0"
png = "0.18.1"
# Text-only clipboard: the default `image-data` feature pulled in the `image`
# crate (and a second `png`) for an API JeTTY never calls. NOT
# `wayland-data-control` either: that backend forks the process to serve a copy
# (see clipboard.rs) — XWayland bridges both selections instead.
arboard = { version = "3.6.1", default-features = false }
global-hotkey = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
# In-place config.toml edits (only changed keys; comments/formatting/unknown keys
# survive). Already in the lockfile — no new download.
toml_edit = "0.25"
dirs = "6.0.0"
# Cross-platform, OS-event-driven filesystem watcher for config + theme hot-reload
# (inotify on Linux, FSEvents on macOS, kqueue on BSD). DE-INDEPENDENT — no
# freedesktop/portal/compositor code — and event-driven, so its backing thread
# blocks in the kernel and adds ZERO idle CPU (no polling). Referenced as `::notify`
# in code because jetty-app already has a local `mod notify` (desktop toasts).
notify = "8"
# Live perf-HUD CPU% sampling. OS-portable / DE-independent (no hand-rolled
# /proc or mach). Minimal feature set: only the `system` module (processes/CPU),
# with disk/network/component/user probes disabled to keep the build light.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Desktop "command finished" notifications — Linux/BSD ONLY (freedesktop).
#   The `z` feature is the PURE-RUST zbus backend, talking to whatever notification
#   daemon is running (KDE, GNOME, dunst, mako, …) over org.freedesktop.Notifications.
#   No GTK/glib, no C libdbus, no tokio. NO KDE/GNOME-specific API. (Verified via
#   `cargo tree`: adds zbus + the smol async stack; `image` stays out.)
#
#   Deliberately NOT a dependency on macOS: notify-rust's mac backend
#   (mac-notification-sys) is suppressed/mis-attributed for a NON-BUNDLED binary
#   anyway (best-effort only, needs a .app bundle — future), and its Objective-C
#   build script breaks a Linux→macOS cross-check. On macOS the GUARANTEED signal
#   is the winit request_user_attention dock bounce (no dep required); see notify.rs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }
# System appearance (follow_system_theme, reduced motion): the freedesktop
# settings portal (org.freedesktop.portal.Settings) — a cross-desktop standard,
# NOT a DE-specific API. Already in the tree via notify-rust (same version and
# async-io executor); `blocking-api` adds only its blocking wrappers (no new
# crate). One watcher thread blocks on the bus: zero idle CPU. See appearance.rs.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
# Tests drive the shell-integration snippets in a REAL shell on a PTY (bash -u).
# Already in the lockfile via jetty-core — no new download.
portable-pty = "0.9"
