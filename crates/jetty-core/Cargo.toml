[package]
name = "jetty-core"
version = "0.0.0"
edition = "2021"

[dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
# SIMD-fast ESC scanning for the O(n) OSC-133 fast path in `Terminal::feed`.
# Already transitive via alacritty/regex; declared direct so the scanner can
# use it. The double-scan of plain text (our memchr + vte's own) is an accepted
# O(n) tradeoff — the PTY drain is not the throughput bottleneck.
memchr = "2"
# Cold-path only: PNG decode (f=100) and zlib inflate (o=z) for the Kitty
# graphics protocol. NOT a new external dependency — both `png` and its
# `miniz_oxide` are already in the workspace lockfile (via jetty-app /
# jetty-platform), so this adds no new download or supply-chain surface. Never
# touched by the render/feed hot path.
png = "0.18.1"
miniz_oxide = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS only: the system locale a shell gets when JeTTY.app was started without
# one (`pty::system_locale`). Already in the tree via wgpu and arboard, NSLocale
# included — no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSLocale", "NSString"] }
