[package]
name = "jetty-platform"
version = "0.0.0"
edition = "2021"

[dependencies]
winit = "0.30"
raw-window-handle = "0.6"
png = "0.18.1"

# X11 only: the user-request raise (`activate_window`) and the summon-hotkey
# grab (`hotkey`, which needs the XKB extension for detectable auto-repeat).
# Already in the tree via winit, arboard and global-hotkey, `xkb` included — no
# new crate.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["xkb"] }
