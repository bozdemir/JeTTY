[package]
name = "jetty-render"
version = "0.0.0"
edition = "2021"

[dependencies]
bytemuck = "1"
glyphon = "0.11"
jetty-core = { path = "../jetty-core" }
pollster = "0.4"
raw-window-handle = "0.6"
# Already in the tree via wgpu/naga — no new download. FxHasher for the per-frame
# grid row-content fingerprints (SipHash was a measurable slice of every frame).
rustc-hash = "2"
# Already in the tree via alacritty_terminal — no new compile unit of note.
# Used for chrome-text display-width estimates (CJK/fullwidth ≈ 2 cells).
unicode-width = "0.2"
wgpu = { version = "29.0", features = ["wgsl"] }
# Already in the tree via swash (glyphon's rasterizer) — no new download. The
# anti-aliased path rasterizer behind the built-in arcs / Powerline shapes.
zeno = { version = "0.3", default-features = false, features = ["eval", "std"] }

[dev-dependencies]
naga = "29"
